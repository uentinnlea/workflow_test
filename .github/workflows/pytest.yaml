name: Run Pytest

on:
  pull_request:
    branches: ["main"]

jobs:
  test:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      
      - name: Install dependencies
        run: pip install -r requirements.txt
      
      - name: Run pytest
        run: pytest

      - name: Failure Log
        if: failure()
        run: echo 'Prevous one is failed'
      
      - name: Get time
        id: get_time
        run: echo "time=$(date)" >> $GITHUB_OUTPUT

      - name: Print github GIITHUB_OUTPUT
        run: echo Previous one is ${{ steps.get_time.outputs.time}}